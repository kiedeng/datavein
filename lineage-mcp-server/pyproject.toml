[project]
name = "lineage-mcp-server"
version = "0.1.0"
description = "血缘 MCP 服务:7 工具 + REST 镜像(设计方案 8 章)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "pymysql>=1.1",
    "DBUtils>=3.0",          # 连接池
    "redis>=5.0",
    "rapidfuzz>=3.0",        # L2 模糊匹配(6.1)
    "requests>=2.31",        # HttpEmbedder:bge 服务化端点(6.1/6.4)
]

[project.optional-dependencies]
# L3 向量检索(6.1/6.4):内网无 chromadb 时 L3 静默跳过,代码为 optional import
vector = ["chromadb>=0.5"]
