[project]
name = "query-gateway"
version = "0.1.0"
description = "查询执行网关:语义层 plan→SQL 确定性编译 + 权限注入 + 只读执行(设计方案 7/11 章)"
requires-python = ">=3.11"
dependencies = [
    # 版本锁死(7.2):升级须跑通 tests/golden 全部用例
    "sqlglot==26.16.4",
    "pyyaml>=6.0",
    "pymysql>=1.1",
    "DBUtils>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
# metrics/ 是数据目录不是包,显式声明防 flat-layout 自动发现报错
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
